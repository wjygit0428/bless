<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>坦克大战</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game">
      <h1>坦克大战</h1>
      <div class="hud">
        <span>得分：<b id="score">0</b></span>
        <span>生命：<b id="lives">3</b></span>
        <span>敌军：<b id="enemies">12</b></span>
      </div>
      <div class="stage">
        <canvas id="canvas" width="416" height="416"></canvas>
        <div id="overlay" class="overlay" hidden>
          <p id="overlay-text"></p>
          <button id="overlay-restart" type="button">再来一局</button>
        </div>
      </div>
      <p class="help">方向键 / WASD 移动 · 空格 射击 · P 暂停 · R 重新开始</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
